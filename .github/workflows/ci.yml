name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ngspice and the open sky130 PDK
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice
          pip install volare==0.20.6 -r requirements.txt
          volare enable --pdk sky130 --pdk-root "$HOME/pdk" c6d73a35f524070e85faff4a6a9eef49553ebc2b
          echo "KAAVAL_PDK_ROOT=$HOME/pdk/sky130A" >> "$GITHUB_ENV"
          echo "PDK_ROOT=$HOME/pdk/sky130A" >> "$GITHUB_ENV"
      - name: tests (they simulate)
        run: for t in tests/test_*.py; do echo "== $t"; python "$t"; done
