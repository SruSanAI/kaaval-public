name: Kaaval analog review
description: >-
  Reviews the analog design in this repository (xschem / SPICE / Magic, sky130) the way Kaaval's server does:
  power-up, loop stability, 45 process-temperature-supply conditions, layout against schematic. Nothing in the
  repository is executed. Findings appear on the pull request's files (SARIF) and as the job log.
branding:
  icon: shield
  color: green
inputs:
  path:
    description: Folder to review (relative to the workspace).
    default: "."
  fail-on:
    description: "risk: fail the job on any design-risk warning; none: report only."
    default: risk
  upload-sarif:
    description: "true: upload the findings to GitHub code scanning (needs security-events: write)."
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: ngspice, Magic, Netgen and the open sky130 PDK
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice magic netgen-lvs
        pip install volare==0.20.6 -r "$GITHUB_ACTION_PATH/requirements.txt"
        volare enable --pdk sky130 --pdk-root "$HOME/pdk" c6d73a35f524070e85faff4a6a9eef49553ebc2b
        echo "KAAVAL_PDK_ROOT=$HOME/pdk/sky130A" >> "$GITHUB_ENV"
        echo "PDK_ROOT=$HOME/pdk/sky130A" >> "$GITHUB_ENV"
    - name: xschem's symbol library (read as text; xschem is not installed)
      shell: bash
      run: |
        git clone --depth 1 --branch 3.4.7 https://github.com/StefanSchippers/xschem /tmp/xschem
        echo "KAAVAL_XSCHEM_LIB=/tmp/xschem/xschem_library" >> "$GITHUB_ENV"
    - name: Kaaval review
      shell: bash
      run: python "$GITHUB_ACTION_PATH/tools/kaaval_check.py" "${{ inputs.path }}" --sarif kaaval.sarif --json kaaval.json --fail-on "${{ inputs.fail-on }}"
    - name: Findings on the pull request
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: kaaval.sarif
        category: kaaval
